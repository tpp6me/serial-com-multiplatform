name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check environment
        run: node scripts/check-env.mjs

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Frontend tests
        run: corepack pnpm test

      - name: Lint
        run: corepack pnpm lint

      - name: Format check
        run: corepack pnpm format:check

      - name: Rust format
        run: corepack pnpm rust:fmt

      - name: Rust tests
        run: corepack pnpm rust:test

      - name: Rust clippy
        run: corepack pnpm rust:clippy

      - name: Tauri compile check
        run: corepack pnpm exec node scripts/run-with-dev-env.mjs tauri build --debug --no-bundle
